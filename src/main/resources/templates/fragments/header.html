<!DOCTYPE html>
<html>
<head>
    ...
</head>
<body>
<div class="" th:fragment="header">
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand" th:href="@{/}">Fiscaliza</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup" aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
                <div class="navbar-nav">
                    <a th:classappend="${linkDisabled eq 'projeto'} ? 'disabled'" class="nav-link active" aria-current="page" th:href="@{/projeto/list}">Projetos</a>
                    <a th:classappend="${linkDisabled eq 'sprint'} ? 'disabled'" class="nav-link" th:href="@{/sprint/list}">Sprints</a>
                    <a th:classappend="${linkDisabled eq 'task'} ? 'disabled'" class="nav-link" th:href="@{/task/list}">Tasks</a>
                    <a th:classappend="${linkDisabled eq 'historia'} ? 'disabled'" class="nav-link" th:href="@{/historia/list}">Histórias</a>
                    <a th:classappend="${linkDisabled eq 'empresa'} ? 'disabled'" class="nav-link" th:href="@{/empresa/list}">Empresas</a>
                    <a th:classappend="${linkDisabled eq 'contrato'} ? 'disabled'" class="nav-link" th:href="@{/contrato/list}">Contratos</a>
                    <a th:classappend="${linkDisabled eq 'atividade'} ? 'disabled'" class="nav-link" th:href="@{/atividade/list}" tabindex="-1" aria-disabled="true">Atividades</a>
                </div>
            </div>
        </div>
    </nav>

    <div th:if="${message}" class="alert alert-danger">
        <span th:text="${message}"></span>
    </div>
</div>
</body>
</html>
